name = "aaig-admin-api"
main = "worker.js"
compatibility_date = "2026-09-08"

[vars]
ADMIN_ORIGIN = "https://ajouaigroup.github.io"
# Public OAuth client id from Google Cloud Console. Empty disables Google
# sign-in; the allow list itself is set with `wrangler secret put
# ADMIN_ALLOWED_EMAILS`.
GOOGLE_CLIENT_ID = "740732014027-p4kg9t0sdo40udsdrr2ug2l30qcqc5cf.apps.googleusercontent.com"
GITHUB_OWNER = "AjouAIGroup"
GITHUB_REPO = "AjouAIGroup.github.io"
GITHUB_REF = "main"
GITHUB_WORKFLOW_ID = "publications-sheet-sync.yml"

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 10
period = 60

[env.dev.vars]
ADMIN_ORIGIN = "https://ajouaigroup.github.io,http://localhost:5173"
GOOGLE_CLIENT_ID = "740732014027-p4kg9t0sdo40udsdrr2ug2l30qcqc5cf.apps.googleusercontent.com"
GITHUB_OWNER = "AjouAIGroup"
GITHUB_REPO = "AjouAIGroup.github.io"
GITHUB_REF = "main"
GITHUB_WORKFLOW_ID = "publications-sheet-sync.yml"

[[env.dev.ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1002"

[env.dev.ratelimits.simple]
limit = 10
period = 60
