name: Refresh External Content

on:
  schedule:
    - cron: "20 3 * * 3"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/content-refresh.yml"
      - "scripts/content/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aaig-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Refresh official sources
        run: npm run content:refresh

      # The admin page lists lab-site publications that are missing from the
      # Google Sheet. It reads them from this branch, which always holds main
      # plus the latest refresh result and is replaced on every run.
      - name: Publish refresh result for the admin page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/external-content
          git add -f \
            content/sources/cache/publications.json \
            content/sources/cache/news.json \
            content/sources/cache/last-sync-report.json
          git commit --allow-empty -m "content: record external refresh ${{ github.run_id }}"
          git push --force origin automation/external-content

      - name: Validate refreshed content
        run: npm run validate:content

      - name: Build refreshed site
        run: npm run build:static
        env:
          VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          VITE_PUBLICATIONS_SHEET_URL: ${{ vars.PUBLICATIONS_SHEET_URL }}

      - name: Archive refreshed content
        uses: actions/upload-artifact@v6
        with:
          name: external-content-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            content/sources/cache/news.json
            content/sources/cache/publications.json
            content/deadlines/venues.json
            src/generated/deadlines.generated.json
            src/generated/news.generated.json
            src/generated/publications.generated.json

      - name: Deploy refreshed site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
