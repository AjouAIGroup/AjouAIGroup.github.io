name: Content Build Check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  content-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm run audit:dependencies

      - name: Check Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check Publication Sheet Template
        run: npm run publications:sheet:check

      - name: Sync Content
        run: npm run content:sync

      # Admin page edits (News, Photos) are committed by the admin Worker,
      # which cannot run the content pipeline, so their regenerated output is
      # committed here instead of being required up front. The deploy already
      # synced content itself, so this push does not need to trigger another.
      - name: Commit Regenerated Output For Admin Edits
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[admin-edit]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run content:sync --silent
            if git diff --quiet -- src/generated; then
              echo "Generated output already matches."
              exit 0
            fi
            git add src/generated
            git commit -m "content: regenerate after admin edit"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Check Generated Output Is Committed
        if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[admin-edit]')) }}
        run: node scripts/content/check.mjs

      - name: Validate Content
        run: npm run validate:content

      - name: Build Site
        run: npm run build
        env:
          VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          VITE_PUBLICATIONS_SHEET_URL: ${{ vars.PUBLICATIONS_SHEET_URL }}
