        <!-- Google shows this as the site name above the result; without it,
             it falls back to the github.io host and shows "GitHub". -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "AAIG",
                "alternateName": [
                    "Ajou AI Group",
                    "Ajou Artificial Intelligence Group"
                ],
                "url": "https://ajouaigroup.github.io/"
            }
        </script>
        <script>
            (function () {
                var params = new URLSearchParams(window.location.search);
                var redirectedPath = params.get("__gh_path__");

                if (!redirectedPath) {
                    return;
                }

                var basePath = window.location.pathname.replace(/\/$/, "");
                var normalizedPath = redirectedPath.startsWith("/")
                    ? redirectedPath
                    : "/" + redirectedPath;
                window.history.replaceState(
                    null,
                    "",
                    basePath + normalizedPath,
                );
            })();
        </script>
