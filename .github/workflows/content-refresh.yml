name: Refresh External Content

on:
  schedule:
    - cron: "20 3 * * 3"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/content-refresh.yml"
      - "scripts/content/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aaig-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Dependencies
        run: npm ci

      - name: Refresh official sources
        run: npm run content:refresh

      - name: Validate refreshed content
        run: npm run validate:content

      - name: Build refreshed site
        run: npm run build:static
        env:
          VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          VITE_PUBLICATIONS_SHEET_URL: ${{ vars.PUBLICATIONS_SHEET_URL }}

      - name: Commit refreshed content
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          refreshed_paths=(
            content/sources/cache/news.json
            content/sources/cache/publications.json
            content/deadlines/venues.json
            src/generated/deadlines.generated.json
            src/generated/news.generated.json
            src/generated/photos.generated.json
            src/generated/publications.generated.json
          )

          if [ -z "$(git status --porcelain -- "${refreshed_paths[@]}")" ]; then
            echo "No external content changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${refreshed_paths[@]}"
          git commit -m "chore(content): refresh external lab sources"

          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
