name: Apply Admin Site Edit

# The admin Worker's token can start workflows but cannot write to the
# repository, so each News or Photos edit from the admin page is handed to
# this workflow. It commits the edit with the regenerated output, then starts
# the deploy itself because pushes made with the workflow token start none.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Edit id issued by the admin Worker
        required: true
        type: string

run-name: Admin edit ${{ inputs.job_id }}

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Edit
        run: node scripts/content/admin-edit.mjs fetch "$JOB_ID" "$RUNNER_TEMP/admin-edit"

      # Another edit or automation may push first, so the edit is re-applied
      # on the newest main until the push goes through.
      - name: Commit Edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/content/admin-edit.mjs apply "$RUNNER_TEMP/admin-edit"
            npm run content:sync --silent
            npm run validate:content --silent
            git add content src/generated
            if git diff --cached --quiet; then
              echo "The edit is already on main."
              exit 0
            fi
            git commit -F "$RUNNER_TEMP/admin-edit/message.txt"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Start Deploy
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release Edit
        if: always()
        run: node scripts/content/admin-edit.mjs release "$JOB_ID"
